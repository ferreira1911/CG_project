<!DOCTYPE html>
<html>
<head lang="en">
    <meta charset="UTF-8">
    <title>Wagon Rush</title>
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rye&family=Segoe+UI:wght@400;600;900&display=swap" rel="stylesheet">

<style>
body, html {
    border: 0;
    padding: 0;
    margin: 0;
    overflow: hidden;
}

canvas {
    width: 100%;
    height: 100%;
}

/* ── Floating combat text ───────────────────────────────── */
@keyframes floatUpAndFade {
    0%   { opacity: 1; transform: translateY(0) scale(1.0); }
    10%  { transform: translateY(-10px) scale(1.2); }
    100% { opacity: 0; transform: translateY(-60px) scale(1.0); }
}
.floating-text {
    position: absolute;
    font-size: 32px;
    font-weight: 900;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.8), -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
    pointer-events: none;
    animation: floatUpAndFade 1.5s ease-out forwards;
    z-index: 20;
}

/* ── Shared pulse animation ─────────────────────────────── */
@keyframes pulse {
    0%   { opacity: 0.6; transform: scale(0.97); }
    50%  { opacity: 1;   transform: scale(1.03); }
    100% { opacity: 0.6; transform: scale(0.97); }
}

/* ── Game-over screen ───────────────────────────────────── */
@keyframes pulse-go {
    0%   { opacity: 0.6; transform: scale(0.95); }
    50%  { opacity: 1;   transform: scale(1.05); }
    100% { opacity: 0.6; transform: scale(0.95); }
}

/* ── Main menu entrance animations ─────────────────────── */
@keyframes fadeInDown {
    0%   { opacity: 0; transform: translateY(-50px); }
    100% { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
    0%   { opacity: 0; }
    100% { opacity: 1; }
}
@keyframes menuFadeOut {
    0%   { opacity: 1; }
    100% { opacity: 0; }
}
.menu-fade-out {
    animation: menuFadeOut 0.6s ease-out forwards;
}

/* ── Main Menu layout ───────────────────────────────────── */
#main-menu {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    /* Radial vignette: dark edges, transparent-ish center so 3D world peeks through */
    background: radial-gradient(ellipse at center,
        rgba(8, 4, 0, 0.55) 0%,
        rgba(5, 2, 0, 0.80) 50%,
        rgba(0, 0, 0, 0.97) 100%);
}

.menu-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    text-align: center;
    max-width: 820px;
    padding: 0 40px;
}

.menu-title {
    font-family: 'Rye', serif;
    font-size: 110px;
    color: #f5c842;
    text-shadow:
        0 0 20px rgba(245, 200, 66, 0.9),
        0 0 60px rgba(245, 160, 20, 0.5),
        4px 4px 0px #7a3d00,
        6px 6px 0px #4a2000;
    letter-spacing: 6px;
    line-height: 1;
    margin-bottom: 12px;
    animation: fadeInDown 0.8s ease-out forwards;
}

.menu-subtitle {
    font-size: 22px;
    font-style: italic;
    color: rgba(255, 230, 170, 0.75);
    letter-spacing: 2px;
    margin-bottom: 36px;
    animation: fadeIn 1s ease-out 0.5s both;
}

.menu-divider {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 36px;
    animation: fadeIn 1s ease-out 0.7s both;
}
.menu-divider::before,
.menu-divider::after {
    content: '';
    flex: 1;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(245,200,66,0.5), transparent);
}
.menu-divider-icon {
    font-size: 28px;
}

.controls-grid {
    display: grid;
    grid-template-columns: auto auto auto auto;
    gap: 10px 24px;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(245, 200, 66, 0.2);
    border-radius: 14px;
    padding: 20px 32px;
    margin-bottom: 44px;
    animation: fadeIn 1s ease-out 0.9s both;
}
.ctrl-key {
    background: rgba(245, 200, 66, 0.15);
    border: 2px solid rgba(245, 200, 66, 0.5);
    border-radius: 8px;
    color: #f5c842;
    font-weight: 700;
    font-size: 15px;
    padding: 5px 12px;
    text-align: center;
    letter-spacing: 1px;
}
.ctrl-desc {
    color: rgba(255, 230, 180, 0.8);
    font-size: 15px;
    text-align: left;
    align-self: center;
}

.menu-start-prompt {
    font-size: 28px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 4px;
    text-shadow: 0 0 12px rgba(245,200,66,0.6), 2px 2px 4px black;
    animation: fadeIn 0.8s ease-out 1.2s both, pulse 1.8s ease-in-out 2s infinite;
}
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════ Main Menu ══ -->
<div id="main-menu">
    <div class="menu-content">
        <div class="menu-title">WAGON RUSH</div>
        <div class="menu-subtitle">Deliver the haybales. Don't crash.</div>

        <div class="menu-divider">
            <span class="menu-divider-icon">🌾</span>
        </div>

        <div class="controls-grid">
            <div class="ctrl-key">W / S</div>
            <div class="ctrl-desc">Accelerate / Brake</div>
            <div class="ctrl-key">A / D</div>
            <div class="ctrl-desc">Steer left / right</div>

            <div class="ctrl-key">P</div>
            <div class="ctrl-desc">Pick up haybale</div>
            <div class="ctrl-key">L</div>
            <div class="ctrl-desc">Drop haybale</div>

            <div class="ctrl-key">R</div>
            <div class="ctrl-desc">Restart after death</div>
            <div class="ctrl-key">F</div>
            <div class="ctrl-desc">Toggle free camera</div>
        </div>

        <div class="menu-start-prompt">— PRESS SPACE TO START —</div>
    </div>
</div>

<!-- ════════════════════════════════════════════ HUD Overlay ══ -->
<div id="hud-container" style="position: absolute; bottom: 30px; left: 30px; z-index: 10; display: none; align-items: flex-end; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: rgba(0,0,0,0.75); padding: 16px 24px; border-radius: 12px; border: 2px solid #555; box-shadow: 0 8px 24px rgba(0,0,0,0.6);">
    
    <!-- Stats Panel -->
    <div style="display: flex; flex-direction: column; margin-right: 30px; border-right: 2px solid #444; padding-right: 30px;">
        <div style="font-size: 18px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; font-weight: 600;">Score</div>
        <div id="score-val" style="color: #ffd700; font-size: 32px; font-weight: 900; text-shadow: 1px 1px 2px black; line-height: 1;">0</div>
        
        <div style="margin-top: 12px; font-size: 18px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; font-weight: 600;">Haybales</div>
        <div id="bales-val" style="color: #ff9800; font-size: 32px; font-weight: 900; text-shadow: 1px 1px 2px black; line-height: 1;">0</div>
    </div>

    <!-- Health Panel -->
    <div style="display: flex; align-items: center; position: relative;">
        <!-- Floating text anchor -->
        <div id="floating-text-anchor" style="position: absolute; top: -20px; left: 50%; transform: translateX(-50%); width: 0; height: 0;"></div>
        
        <div id="hp-number" style="color: #fff; font-size: 36px; font-weight: 900; width: 70px; text-align: right; margin-right: 15px; text-shadow: 2px 2px 4px black;">100</div>
        <div style="width: 300px; height: 28px; background: #1a1a1a; border-radius: 14px; overflow: hidden; border: 3px solid #333; box-shadow: inset 0 3px 6px rgba(0,0,0,0.9), 0 0 10px rgba(0,0,0,0.5);">
            <div id="hp-bar" style="width: 100%; height: 100%; background: linear-gradient(90deg, #2e7d32, #4caf50, #8bc34a); box-shadow: inset 0 2px 4px rgba(255,255,255,0.3); transition: width 0.15s ease-out, background 0.3s;"></div>
        </div>
    </div>
</div>

<!-- ══════════════════════════════════════ Game Over Screen ══ -->
<div id="game-over-screen" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; flex-direction: column; align-items: center; justify-content: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
    <div style="color: #ff3333; font-size: 100px; font-weight: 900; letter-spacing: 5px; text-shadow: 4px 4px 10px black, 0 0 30px red; margin-bottom: 20px;">GAME OVER</div>
    <div style="color: white; font-size: 32px; font-weight: 600; text-shadow: 2px 2px 5px black; letter-spacing: 2px; animation: pulse-go 1.5s infinite;">Press 'R' to Restart</div>
</div>

<script type="module" src="main.js"></script>

</body>
</html>
